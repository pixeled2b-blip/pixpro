<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e3a34">
<title>Prospection Corse</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Page 1 : recherche de l'enseigne + bouton Cartographie. Fiche en questions. Carte colorée par état. */
:root{
  --bg:#f3f1ec; --card:#ffffff; --fg:#1d2522; --muted:#66706b; --line:#dcd8cf;
  --accent:#1e5a4b; --accent-fg:#ffffff; --chip:#e7e3d9;
  --c-client:#2f9e5a; --c-devis:#e8830c; --c-refus:#7b3fc4; --c-afaire:#5b6b7a; --late:#b3261e;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141917; --card:#1d2420; --fg:#e8ece9; --muted:#9aa6a0; --line:#2e3833;
  --accent:#5fb89f; --accent-fg:#0d1512; --chip:#28322d; --late:#ff8a80; color-scheme:dark}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--font);display:flex;flex-direction:column;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);box-sizing:border-box;overflow:hidden}
*{box-sizing:border-box}
h1{font-size:18px;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
header{display:flex;align-items:center;gap:8px;padding:10px 0 6px}
header .count{color:var(--muted);font-size:13px;margin-left:auto}
main{flex:1;min-height:0;overflow-y:auto;padding-bottom:12px;-webkit-overflow-scrolling:touch}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}
nav button{border:0;background:none;padding:8px 2px;border-radius:10px;color:var(--muted);font-size:13px;min-height:44px}
nav button[aria-selected="true"]{background:var(--chip);color:var(--fg);font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1 1 140px}
.field>span{font-size:12px;color:var(--muted)}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0;width:100%}
textarea{min-height:110px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.btn.danger{color:var(--late)}
.btn.small{min-height:36px;padding:6px 10px;font-size:13px}
.btn.big{width:100%;min-height:56px;font-size:17px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.item{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .s{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.badge{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--fg)}
.badge.late{background:var(--late);color:#fff}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:baseline}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:2000;overflow-y:auto;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-left,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-right,0px))}
.sheet h2{font-size:18px;margin:6px 0 0;overflow-wrap:anywhere}
.sheet h3,main h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 8px}
.sheet .bar{position:sticky;top:0;background:var(--bg);padding:6px 0;display:flex;gap:8px;align-items:center;z-index:2}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:2px solid var(--line);background:var(--card);border-radius:12px;min-height:52px;font-weight:600}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--chip)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;min-height:40px}
.chip.on{border-color:var(--c-devis);background:var(--chip);font-weight:600}
.devis{margin-bottom:10px;display:grid;gap:8px}
.mono{font-variant-numeric:tabular-nums}
#map{height:58vh;min-height:300px;border-radius:12px;z-index:0}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:13px;margin:8px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:10px;z-index:3000;max-width:90%}
progress{width:100%;height:10px}
.muted{color:var(--muted)}.small{font-size:13px}
.lbl{display:flex;gap:6px;align-items:center}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}
.filters .wide{grid-column:1/-1}
</style>
</head>
<body>
<header><h1>Prospection Corse</h1><span class="count" id="count"></span></header>
<main id="main"></main>
<nav id="nav" role="tablist">
  <button role="tab" data-tab="accueil" aria-selected="true">Accueil</button>
  <button role="tab" data-tab="carte" aria-selected="false">Cartographie</button>
  <button role="tab" data-tab="relances" aria-selected="false">Relances</button>
  <button role="tab" data-tab="donnees" aria-selected="false">Données</button>
</nav>
<div id="sheet" class="sheet" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
"use strict";
/* ---------- utilitaires ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>ymd(new Date());
const eur=n=>(Number(n)||0).toLocaleString("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:0});
const uid=()=>Math.random().toString(36).slice(2,9);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function toast(msg,ms=3200){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms)}
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const fmtDate=s=>s?new Date(s+"T12:00:00").toLocaleDateString("fr-FR",{day:"2-digit",month:"short",year:"numeric"}):"";
function km(a,b,c,d){const R=6371000,t=x=>x*Math.PI/180,dl=t(c-a),dn=t(d-b);
  const h=Math.sin(dl/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const fmtDist=m=>m<1000?Math.round(m)+" m":(m/1000).toFixed(1).replace(".",",")+" km";

/* ---------- produits, états, couleurs ---------- */
const PRODUITS=["TV hospitality","Écran LED","Écran intérieur","Écran extérieur","Halo","TBI","WiFi","Caméra","Alarme","Serrure connectée","Fibre"];
const COL={client:"#2f9e5a",devis:"#e8830c",refus:"#7b3fc4",afaire:"#5b6b7a"};
const LABEL={client:"Client",devis:"Devis fait",refus:"Pas de devis",afaire:"À faire"};
/* état d'une fiche, global ou pour un produit */
function etat(e,prod){
  const ds=(e.devis||[]).filter(d=>!prod||d.produit===prod);
  if(ds.some(d=>d.statut==="accepté"))return"client";
  if(ds.some(d=>d.statut==="en cours"))return"devis";
  if(ds.length)return"refus";
  if(!prod&&e.refus)return"refus";
  return"afaire";
}

/* ---------- NAF, TVA ---------- */
const SECTIONS={A:"Agriculture, sylviculture, pêche",B:"Industries extractives",C:"Industrie manufacturière",D:"Énergie",E:"Eau, déchets",F:"Construction",G:"Commerce, réparation auto",H:"Transports, entreposage",I:"Hébergement et restauration",J:"Information, communication",K:"Finance, assurance",L:"Immobilier",M:"Services spécialisés, scientifiques, techniques",N:"Services administratifs",O:"Administration publique",P:"Enseignement",Q:"Santé, action sociale",R:"Arts, spectacles, loisirs",S:"Autres services",T:"Ménages employeurs",U:"Extraterritorial"};
function sectionOf(naf){
  const d=parseInt(String(naf||"").slice(0,2),10);if(!d)return"";
  if(d<=3)return"A";if(d<=9)return"B";if(d<=33)return"C";if(d===35)return"D";if(d<=39)return"E";if(d<=43)return"F";
  if(d<=47)return"G";if(d<=53)return"H";if(d<=56)return"I";if(d<=63)return"J";if(d<=66)return"K";if(d===68)return"L";
  if(d<=75)return"M";if(d<=82)return"N";if(d===84)return"O";if(d===85)return"P";if(d<=88)return"Q";if(d<=93)return"R";
  if(d<=96)return"S";if(d<=98)return"T";return"U";
}
const catLabel=e=>e.section?(e.section+" · "+SECTIONS[e.section]):"";
function tvaFromSiren(siren){
  if(!/^\d{9}$/.test(siren))return"";
  return"FR"+pad((12+3*(Number(siren)%97))%97)+siren;
}

/* ---------- base locale (IndexedDB) ---------- */
let idb;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open("prospection-corse",1);
  r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore("ent",{keyPath:"siren"});d.createObjectStore("meta")};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
const tx=(store,mode="readonly")=>idb.transaction(store,mode).objectStore(store);
const reqP=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const dbAll=()=>reqP(tx("ent").getAll());
function dbPutMany(list){return new Promise((res,rej)=>{const t=idb.transaction("ent","readwrite");const s=t.objectStore("ent");
  list.forEach(x=>{const c=Object.assign({},x);delete c._new;delete c._poi;s.put(c)});t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
const dbDelete=k=>reqP(tx("ent","readwrite").delete(k));
const metaGet=k=>reqP(tx("meta").get(k));
const metaSet=(k,v)=>reqP(tx("meta","readwrite").put(v,k));

/* ---------- état de l'appli ---------- */
let ents=[],byId=new Map(),searchIdx=new Map();
let tab="accueil";
let pois=[],poiLayer=null,comp={status:"",cands:[],q:""};
let me=null,watchId=null;                 // position GPS de l'utilisateur
const MAPF={radius:0,prod:"",etat:""};   // filtres de la carte
let mapView=null;

function newEnt(o){
  return Object.assign({siren:"",nom:"",adresse:"",cp:"",commune:"",dept:"",naf:"",section:"",tva:"",lat:null,lng:null,
    tel:"",contact:"",fonction:"",mobile:"",notes:"",posTerrain:null,devis:[],refus:null,raison:"",siret:"",maj:""},o);
}
function index(e){searchIdx.set(e.siren,norm([e.nom,e.siren,e.commune,e.cp,e.naf,e.contact,e.adresse].join(" ")))}
function saveEnt(e){e.maj=new Date().toISOString();index(e);return dbPutMany([e])}

/* ---------- relances ---------- */
function relanceInfo(e){
  const dates=[];
  (e.devis||[]).forEach(d=>{if(d.statut==="en cours"&&d.relance)dates.push(d.relance)});
  if(e.refus&&e.refus.relance)dates.push(e.refus.relance);
  if(!dates.length)return null;
  const next=dates.sort()[0],t=today();
  return{date:next,late:next<t,today:next===t};
}
const devisEnCours=e=>(e.devis||[]).filter(d=>d.statut==="en cours");
function badges(e){
  const b=[],r=relanceInfo(e),st=etat(e);
  b.push(`<span class="badge"><span class="dot" style="background:${COL[st]}"></span>${LABEL[st]}</span>`);
  const prods=[...new Set((e.devis||[]).map(d=>d.produit).filter(Boolean))];
  if(prods.length)b.push(`<span class="badge">${esc(prods.join(", "))}</span>`);
  if(r)b.push(`<span class="badge ${r.late?"late":""}">${r.late?"Relance en retard : ":r.today?"Relance aujourd'hui":"Relance : "}${r.today?"":fmtDate(r.date)}</span>`);
  if(e.refus&&!e.refus.relance)b.push(`<span class="badge late">Date de relance manquante</span>`);
  return b.join("");
}

/* ---------- reconnaissance vocale ---------- */
function dictate(btn,getVal,setVal,onEnd){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast("Dictée non disponible sur ce navigateur (essayez Chrome ou Safari).");return}
  if(btn._rec){btn._rec.stop();return}
  const rec=new SR(),label=btn.textContent;rec.lang="fr-FR";rec.continuous=!onEnd;rec.interimResults=false;btn._rec=rec;
  btn.textContent="■";
  rec.onresult=ev=>{let t="";for(let i=ev.resultIndex;i<ev.results.length;i++)if(ev.results[i].isFinal)t+=ev.results[i][0].transcript+" ";
    if(t){const c=getVal();setVal((c&&!/\s$/.test(c)?c+" ":c)+t.trim())}};
  rec.onerror=ev=>toast(ev.error==="not-allowed"?"Micro refusé : autorisez-le dans les réglages du navigateur.":"Dictée interrompue ("+ev.error+")");
  rec.onend=()=>{btn._rec=null;btn.textContent=label;if(onEnd)onEnd()};
  try{rec.start()}catch(e){btn._rec=null;btn.textContent=label}
}

/* ---------- géolocalisation ---------- */
function getPos(){return new Promise((res,rej)=>{
  if(!navigator.geolocation)return rej(new Error("Géolocalisation indisponible"));
  navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy),date:new Date().toISOString()}),
    er=>rej(new Error(er.code===1?"Position refusée : autorisez la localisation pour ce site.":"Position introuvable.")),
    {enableHighAccuracy:true,timeout:20000,maximumAge:0})})}

/* ---------- recherche en ligne : SIREN/TVA (data.gouv) + téléphone/GPS (OpenStreetMap) ---------- */
let onlineResults=[];
const FORMES=/\b(sarl|sas|sasu|eurl|sci|sa|snc|scop|earl|selarl|societe|ste|entreprise|etablissements|ets)\b/gi;
function enseigneOf(x){
  const g=x.siege||{};
  if(g.liste_enseignes&&g.liste_enseignes.length)return g.liste_enseignes[0];
  const m=String(x.nom_complet||"").match(/\(([^)]+)\)/);return m?m[1]:"";
}
function enseignesOf(o){return [...(o.liste_enseignes||[]),o.nom_commercial].filter(Boolean)}
/* établissement dont l'enseigne (nom commercial) ressemble le plus au nom cherché */
function etabMatch(x,tk){
  const list=[x.siege,...(x.matching_etablissements||[])].filter(Boolean);
  let best=null,bs=-1;
  list.forEach(o=>{const hay=norm(enseignesOf(o).join(" "));const sc=tk.length?tk.filter(w=>hay.includes(w)).length/tk.length:0;if(sc>bs){bs=sc;best=o}});
  const et=best||x.siege||{};
  return{etab:et,ens:bs>0?enseignesOf(et).join(", "):"",s:Math.max(bs,0)};
}
function legalScore(x,tk){const hay=norm(x.nom_complet+" "+(x.nom_raison_sociale||""));return tk.length?tk.filter(w=>hay.includes(w)).length/tk.length:0}
function toks(s){return norm(s).replace(/[^a-z0-9]+/g," ").split(" ").filter(t=>t.length>2&&!/^(les|des|the|sarl|sas|sasu|eurl|sci|snc|cie|ets|societe|ste|sas)$/.test(t))}
async function searchOnline(q){
  const box=$("#registry");if(!box)return;
  box.innerHTML=`<div class="card muted">Recherche de l'enseigne « ${esc(q)} » en Corse…</div>`;
  try{
    const tk=toks(q);
    const rs=await Promise.all(["2A","2B"].map(d=>
      fetch("https://recherche-entreprises.api.gouv.fr/search?q="+encodeURIComponent(q)+"&departement="+d+"&etat_administratif=A&per_page=8")
        .then(r=>r.ok?r.json():{results:[]}).catch(()=>({results:[]}))));
    const seen=new Set();
    onlineResults=rs.flatMap((j,i)=>(j.results||[]).map(x=>({x,dept:["2A","2B"][i]})))
      .filter(o=>!seen.has(o.x.siren)&&seen.add(o.x.siren))
      .map(o=>{const m=etabMatch(o.x,tk);return Object.assign(o,{etab:m.etab,ens:m.ens,rank:m.s+0.4*legalScore(o.x,tk)})})
      .sort((a,b)=>b.rank-a.rank).slice(0,10);
    onlineResults.q=q;
    box.innerHTML=(onlineResults.length?`<h3>Sociétés pouvant correspondre à « ${esc(q)} »</h3><div class="small muted" style="margin-bottom:6px">Touchez la bonne pour créer la fiche et la lier à cette société.</div>`+onlineResults.map((o,i)=>{
      const x=o.x,g=o.etab||{};
      return `<button class="item" data-pick="${i}"><div class="t">${esc(o.ens||q)}</div>
        <div class="s">Société : ${esc(x.nom_complet||"")}</div>
        <div class="s">${esc([g.adresse].filter(Boolean).join(""))}</div>
        <div class="s mono">SIREN ${esc(x.siren)} · TVA ${esc(tvaFromSiren(String(x.siren)))}</div></button>`}).join("")
      :`<div class="card muted">Aucune société liée à ce nom commercial. Créez la fiche à la main, puis cherchez la société depuis la fiche.</div>`)+
      `<button class="btn" id="manual" style="width:100%">+ Créer la fiche « ${esc(q)} » sans société</button>`;
    const mb=$("#manual");if(mb)mb.onclick=()=>openFiche(null,q);
  }catch(er){box.innerHTML=`<div class="card">Recherche impossible : ${esc(er.message)}. Vérifiez la connexion.</div>`}
}
async function pickOnline(i){
  const o=onlineResults[i];if(!o)return;
  const x=o.x,g=o.etab||x.siege||{},siren=String(x.siren);
  if(byId.has(siren)){openFiche(siren);return}
  const naf=g.activite_principale||x.activite_principale||"";
  const e=newEnt({siren,nom:o.ens||onlineResults.q||x.nom_complet||"",raison:x.nom_complet||"",siret:g.siret||"",
    adresse:g.adresse?g.adresse.replace(/\s+\d{5}\s.*$/,""):"",cp:g.code_postal||"",
    commune:g.libelle_commune||"",dept:o.dept,naf,section:x.section_activite_principale||sectionOf(naf),tva:tvaFromSiren(siren),
    lat:g.latitude?+g.latitude:null,lng:g.longitude?+g.longitude:null});
  ents.push(e);byId.set(siren,e);await saveEnt(e);
  openFiche(siren);
  lookupOSM(e,true);
}
/* ---------- page 1 : le commerce est cherché sur OpenStreetMap ---------- */
let placeResults=[];
const TYPE_WORDS=/\b(restaurant|resto|bar|cafe|brasserie|hotel|pizzeria|boulangerie|patisserie|pharmacie|snack|epicerie|magasin|boutique|salon|coiffeur|garage|supermarche|tabac|bureau)\b/gi;
function placeVariants(q){
  const t=q.trim().replace(/\s+/g," ");
  const m=t.match(/^(.*?)\s+(?:à|a|au|sur|dans|en)\s+([^\s].*)$/i);
  const name=m?m[1]:t,town=m?m[2]:"";
  const bare=norm(name).replace(TYPE_WORDS," ").replace(/\s+/g," ").trim();
  const v=[];
  if(m)v.push(name+" "+town+" Corse");
  v.push(t.replace(/\s(?:à|a)\s/gi," ")+" Corse");
  if(m&&bare)v.push(bare+" "+town+" Corse");
  if(bare)v.push(bare+" Corse");
  return [...new Set(v.map(x=>x.trim()))];
}
function mapNom(p){
  const a=p.address||{},t=p.extratags||{};
  return{src:"osm",id:p.osm_type+p.osm_id,nom:(p.namedetails&&p.namedetails.name)||p.name||String(p.display_name||"").split(",")[0],
    adresse:[a.house_number,a.road].filter(Boolean).join(" "),cp:a.postcode||"",commune:a.city||a.town||a.village||a.municipality||"",
    tel:cleanPhone(t.phone||t["contact:phone"]||t.mobile||t["contact:mobile"]),lat:+p.lat,lng:+p.lon,type:p.type||""};
}
async function searchPlaces(q){
  const box=$("#online");if(!box)return;
  const reg=$("#registry");if(reg)reg.innerHTML="";
  box.innerHTML=`<div class="card muted">Recherche de « ${esc(q)} » sur OpenStreetMap…</div>`;
  let found=[],err="";
  const vs=placeVariants(q);
  for(let i=0;i<vs.length&&!found.length;i++){
    try{
      if(i)await sleep(1100);
      const r=await fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=8&addressdetails=1&extratags=1&namedetails=1&accept-language=fr&countrycodes=fr&viewbox=8.5,43.1,9.65,41.3&bounded=1&q="+encodeURIComponent(vs[i]));
      if(!r.ok){err="OpenStreetMap a répondu "+r.status;continue}
      found=(await r.json()).filter(p=>OSM_OK.includes(p.category)).map(mapNom);
    }catch(er){err=er.message}
  }
  placeResults=found;
  if(!document.body.contains(box))return;
  box.innerHTML=(found.length?`<h3>Trouvé sur OpenStreetMap</h3><div class="small muted" style="margin-bottom:6px">Touchez le bon commerce : la fiche est créée avec son adresse, puis la société est cherchée.</div>`+
    found.map((p,i)=>`<button class="item" data-place="${i}"><div class="t">${esc(p.nom)}</div>
      <div class="s">${esc([p.adresse,p.cp,p.commune].filter(Boolean).join(" "))||"Adresse non renseignée"}</div>
      <div class="s">${esc(p.type)}${p.tel?" · "+esc(p.tel):""}</div></button>`).join("")
    :`<div class="card muted">${err?"Recherche impossible : "+esc(err)+".":"Rien trouvé sur OpenStreetMap pour « "+esc(q)+" »."}</div>`)+
    `<div class="row" style="margin-top:4px"><button class="btn small" id="regbtn">Chercher dans le registre des sociétés</button><button class="btn small" id="manual">Créer la fiche à la main</button></div>`;
  $("#regbtn").onclick=()=>searchOnline(q);
  $("#manual").onclick=()=>openFiche(null,q);
}
async function pickPlace(i){
  const p=placeResults[i];if(!p)return;
  const pt=toks(p.nom);
  const dup=ents.find(e=>e.lat&&km(e.lat,e.lng,p.lat,p.lng)<30&&toks(e.nom).some(w=>pt.includes(w)));
  if(dup){openFiche(dup.siren);toast("Cette fiche existe déjà dans votre base");return}
  const e=newEnt({siren:"P"+Date.now().toString(36).toUpperCase(),nom:p.nom,adresse:p.adresse,cp:p.cp,commune:p.commune,tel:p.tel,lat:p.lat,lng:p.lng,dept:deptFromCp(p.cp)});
  ents.push(e);byId.set(e.siren,e);await saveEnt(e);
  openFiche(e.siren);
  findCompany(e,false);
}
const OSM_OK=["shop","amenity","tourism","office","craft","leisure","healthcare"];
const cleanPhone=p=>String(p||"").split(";")[0].trim().replace(/^\+33\s?/,"0");
async function lookupOSM(e,silent){
  const ens=(String(e.nom).match(/\(([^)]+)\)/)||[])[1]||"";
  const base=String(e.nom).replace(/\([^)]*\)/g,"").replace(FORMES,"").trim();
  const qs=[...new Set([ens&&ens+" "+e.commune,base+" "+e.commune,ens,base].filter(s=>s&&s.trim().length>2))];
  if(!silent)toast("Recherche du téléphone et du point GPS…");
  for(const q of qs){
    try{
      const r=await fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&extratags=1&accept-language=fr&countrycodes=fr&viewbox=8.5,43.1,9.65,41.3&bounded=1&q="+encodeURIComponent(q+" Corse"));
      if(r.ok){
        const arr=(await r.json()).filter(p=>OSM_OK.includes(p.category));
        const hit=arr.find(p=>p.extratags&&(p.extratags.phone||p.extratags["contact:phone"]||p.extratags.mobile||p.extratags["contact:mobile"]))||arr[0];
        if(hit){
          const t=hit.extratags||{},ph=cleanPhone(t.phone||t["contact:phone"]||t.mobile||t["contact:mobile"]);
          e.lat=+hit.lat;e.lng=+hit.lon;if(ph&&!e.tel)e.tel=ph;
          await saveEnt(e);
          if(cur===e&&!$("#sheet").hidden)renderFiche();
          toast(ph?"Téléphone et point GPS trouvés (OpenStreetMap)":"Point GPS trouvé, téléphone non référencé : à saisir");
          return true;
        }
      }
    }catch(er){}
    await sleep(1100);
  }
  toast("Aucune correspondance OpenStreetMap : saisissez le téléphone, ou relevez votre position sur place.",4500);
  return false;
}

function stopWatch(){if(watchId!==null&&navigator.geolocation){navigator.geolocation.clearWatch(watchId)}watchId=null}
function startWatch(){
  if(watchId!==null||!navigator.geolocation)return;
  watchId=navigator.geolocation.watchPosition(p=>{
    me={lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy)};
    if(tab!=="carte"||!map)return;
    drawMe();

  {enableHighAccuracy:true,maximumAge:5000,timeout:30000});
}
function drawMe(){

/* ---------- commerces trouvés sur internet (OpenStreetMap, Google Places) ---------- */
const POI_MIN_ZOOM=14;
function poiKnown(p){
  const pt=toks(p.nom);
  return ents.some(e=>e.lat&&e.lng&&Math.abs(e.lat-p.lat)<0.0005&&Math.abs(e.lng-p.lng)<0.0007&&km(e.lat,e.lng,p.lat,p.lng)<40&&toks(e.nom).some(w=>pt.includes(w)));
}
function deptFromCp(cp){const c=String(cp||"");return /^20[01]/.test(c)?"2A":/^20[2-6]/.test(c)?"2B":""}
async function fetchOsmPois(){
  if(map.getZoom()<POI_MIN_ZOOM){toast("Zoomez davantage (quartier ou rue) pour lister les commerces.");return null}
  const b=map.getBounds(),bb=[b.getSouth(),b.getWest(),b.getNorth(),b.getEast()].map(v=>v.toFixed(5)).join(",");
  const q='[out:json][timeout:25];('+
    'nwr["name"]["shop"]('+bb+');'+
    'nwr["name"]["amenity"~"^(restaurant|cafe|bar|fast_food|pub|bank|pharmacy|ice_cream|dentist|doctors|clinic|veterinary|car_rental|cinema|nightclub|post_office)$"]('+bb+');'+
    'nwr["name"]["office"]('+bb+');nwr["name"]["craft"]('+bb+');'+
    'nwr["name"]["tourism"~"^(hotel|guest_house|apartment|hostel|motel|camp_site|museum|gallery|chalet)$"]('+bb+'););out center tags 500;';
  toast("Recherche des commerces de la zone…");
  const r=await fetch("https://overpass-api.de/api/interpreter",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"data="+encodeURIComponent(q)});
  if(!r.ok)throw new Error("Overpass "+r.status+", réessayez dans un instant");
  const j=await r.json();
  return (j.elements||[]).map(el=>{
    const t=el.tags||{},c=el.center||el;if(!c.lat||!t.name)return null;
    return{src:"osm",id:el.type+el.id,nom:t.name,adresse:[t["addr:housenumber"],t["addr:street"]].filter(Boolean).join(" "),
      cp:t["addr:postcode"]||"",commune:t["addr:city"]||"",tel:cleanPhone(t.phone||t["contact:phone"]||t.mobile||t["contact:mobile"]),
      lat:c.lat,lng:c.lon,type:t.shop||t.amenity||t.office||t.craft||t.tourism||""};
  }).filter(Boolean);
}
async function fetchGooglePois(){
  const key=ls.get("google_key");
  if(!key){toast("Ajoutez d'abord votre clé Google Places dans l'onglet Données.");return null}
  const c=map.getCenter(),b=map.getBounds();
  const radius=Math.round(Math.min(Math.max(km(c.lat,c.lng,b.getNorth(),c.lng),100),3000));
  toast("Interrogation de Google…");
  const r=await fetch("https://places.googleapis.com/v1/places:searchNearby",{method:"POST",
    headers:{"Content-Type":"application/json","X-Goog-Api-Key":key,
      "X-Goog-FieldMask":"places.id,places.displayName,places.formattedAddress,places.location,places.nationalPhoneNumber,places.primaryTypeDisplayName"},
    body:JSON.stringify({locationRestriction:{circle:{center:{latitude:c.lat,longitude:c.lng},radius:radius}},maxResultCount:20,languageCode:"fr"})});
  if(!r.ok){let m="";try{m=(await r.json()).error.message}catch(e){}throw new Error("Google "+r.status+(m?" : "+m:""))}
  const j=await r.json();
  return (j.places||[]).map(p=>{
    const parts=String(p.formattedAddress||"").split(",").map(x=>x.trim());
    const m=parts.slice(1).join(" ").match(/(\d{5})\s+([^,]+)/);
    return{src:"google",id:p.id,nom:(p.displayName||{}).text||"",adresse:parts[0]||"",cp:m?m[1]:"",commune:m?m[2].trim():"",
      tel:p.nationalPhoneNumber||"",lat:p.location.latitude,lng:p.location.longitude,type:(p.primaryTypeDisplayName||{}).text||""};
  });
}
async function loadPois(src){
  if(!map)return;
  try{
    const list=src==="google"?await fetchGooglePois():await fetchOsmPois();
    if(!list)return;
    const have=new Set(pois.map(p=>p.src+p.id));let n=0;
    list.forEach(p=>{if(p.nom&&!have.has(p.src+p.id)&&!poiKnown(p)){pois.push(p);have.add(p.src+p.id);n++}});
    drawPois();
    toast(n+" commerce(s) ajouté(s) à la carte"+(list.length>n?" ("+(list.length-n)+" déjà dans votre base)":""));
  }catch(er){toast("Recherche impossible : "+er.message,5000)}
}
function drawPois(){
  if(!map||!poiLayer)return;
  poiLayer.clearLayers();
  pois.forEach((p,i)=>L.circleMarker([p.lat,p.lng],{radius:7,color:"#333",weight:2.5,fillColor:"#fff",fillOpacity:1})
    .bindTooltip(p.nom).on("click",()=>pickPoi(i)).addTo(poiLayer));
  const box=$("#poilist");if(!box)return;
  if(!pois.length){box.innerHTML="";return}
  const o=me||{lat:map.getCenter().lat,lng:map.getCenter().lng};

    `<button class="item" data-poi="${i}"><div class="t">${esc(p.nom)} <span class="muted small">· ${fmtDist(d)}</span></div>
     <div class="s">${esc([p.adresse,p.cp,p.commune].filter(Boolean).join(" "))}</div>
     <div class="s">${esc(p.type)}${p.tel?" · "+esc(p.tel):""} · ${p.src==="google"?"Google":"OpenStreetMap"}</div></button>`).join("");
}
async function reverseFill(e){
  try{
    const r=await fetch("https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&accept-language=fr&zoom=18&lat="+e.lat+"&lon="+e.lng);
    if(!r.ok)return;const a=(await r.json()).address||{};
    if(!e.adresse)e.adresse=[a.house_number,a.road].filter(Boolean).join(" ");
    if(!e.cp)e.cp=a.postcode||"";
    if(!e.commune)e.commune=a.city||a.town||a.village||a.municipality||"";
  }catch(er){}
}
async function pickPoi(i){
  const p=pois[i];if(!p)return;
  const e=newEnt({siren:"P"+Date.now().toString(36).toUpperCase(),nom:p.nom,adresse:p.adresse,cp:p.cp,commune:p.commune,tel:p.tel,lat:p.lat,lng:p.lng,dept:deptFromCp(p.cp)});
  e._new=true;e._poi=true;
  openFiche(null,null,e);
  if(!e.commune||!e.cp||!e.adresse){await reverseFill(e);if(cur===e){e.dept=e.dept||deptFromCp(e.cp);renderFiche()}}
  if(cur===e)findCompany(e,false);

/* ---------- recherche de la société et insertion ---------- */
function addrScore(e,g){
  const ea=norm(e.adresse),ga=norm((g&&g.adresse)||"");if(!ea||!ga)return 0;
  const num=(ea.match(/^\d+/)||[""])[0];
  const st=toks(ea.replace(/^\d+\s*(bis|ter)?\s*/,"")).filter(w=>!/^(rue|avenue|boulevard|place|quai|chemin|route|cours|impasse|allee|residence|lotissement)$/.test(w));
  if(!st.length||!st.every(w=>ga.includes(w)))return 0;
  return num&&new RegExp("(^|\\s)"+num+"(\\s|$)").test(ga)?1:0.5;
}
async function findCompany(e,auto,custom){
  const base=custom||String(e.nom).replace(/\([^)]*\)/g,"").trim();
  if(base.length<2){toast("Saisissez le nom à chercher");return}
  comp={status:"busy",cands:[],q:base};paintComp();
  const get=async url=>{try{const r=await fetch(url);return r.ok?(await r.json()).results||[]:[]}catch(er){return[]}};
  try{
    const out=[],tk=toks(base),B="https://recherche-entreprises.api.gouv.fr/search?etat_administratif=A&per_page=8&";
    for(const d of ["2A","2B"]){
      let rs=await get(B+"q="+encodeURIComponent(base)+"&departement="+d+(e.cp&&!custom?"&code_postal="+e.cp:""));
      if(!rs.length&&e.cp&&!custom)rs=await get(B+"q="+encodeURIComponent(base)+"&departement="+d);
      rs.forEach(x=>out.push({x,d}));
    }
    if(e.adresse&&e.cp){ // la société installée à l'adresse du commerce
      (await get(B+"q="+encodeURIComponent(e.adresse)+"&code_postal="+e.cp)).forEach(x=>out.push({x,d:deptFromCp(e.cp)||e.dept||""}));
    }
    const seen=new Set();
    const cands=out.filter(o=>!seen.has(o.x.siren)&&seen.add(o.x.siren)).map(({x,d})=>{
      const m=etabMatch(x,tk),list=[x.siege,...(x.matching_etablissements||[])].filter(Boolean);
      let ba=0,be=null;list.forEach(g=>{const sc=addrScore(e,g);if(sc>ba){ba=sc;be=g}});
      const g=ba>0?be:m.etab;
      const loc=!!((e.commune&&norm(g.libelle_commune)===norm(e.commune))||(e.cp&&g.code_postal===e.cp));
      return{x,d:d||deptFromCp(g.code_postal),etab:g,ens:m.ens,loc,addr:ba,rank:m.s+0.4*legalScore(x,tk)+(loc?0.4:0)+1.2*ba};
    }).sort((a,b)=>b.rank-a.rank);
    comp={status:"done",cands:cands.slice(0,6),q:base};
    if(cur===e)paintComp();
  }catch(er){comp={status:"done",cands:[],q:base};if(cur===e){paintComp();toast("Recherche impossible : "+er.message,4500)}}
}
async function linkCompany(e,x,dept,etab){
  const g=etab||x.siege||{},siren=String(x.siren),naf=g.activite_principale||x.activite_principale||"";
  const old=e.siren;
  const ex=byId.get(siren);
  if(ex&&ex!==e){
    // la société est déjà dans la base : on y reporte le point GPS du commerce et le téléphone
    if(e.lat){ex.lat=e.lat;ex.lng=e.lng}
    if(e.tel&&!ex.tel)ex.tel=e.tel;
    if(e.posTerrain&&!ex.posTerrain)ex.posTerrain=e.posTerrain;
    if(!ex.raison)ex.raison=x.nom_complet||"";
    if(!ex.siret)ex.siret=g.siret||(x.siege||{}).siret||"";
    if(!e._new){await dbDelete(old);byId.delete(old);const k=ents.indexOf(e);if(k>=0)ents.splice(k,1)}
    await saveEnt(ex);cur=ex;comp={status:"linked",cands:[],q:""};renderFiche();
    toast("Fiche existante mise à jour : SIREN "+siren);return;
  }
  e.raison=x.nom_complet||"";e.siret=g.siret||(x.siege||{}).siret||"";
  e.siren=siren;e.tva=tvaFromSiren(siren);e.naf=naf;e.section=x.section_activite_principale||sectionOf(naf);
  e.dept=dept||e.dept||deptFromCp(g.code_postal);
  if(!e.adresse){e.adresse=g.adresse?g.adresse.replace(/\s+\d{5}\s.*$/,""):"";e.cp=e.cp||g.code_postal||"";e.commune=e.commune||g.libelle_commune||""}
  if(!e.lat&&g.latitude){e.lat=+g.latitude;e.lng=+g.longitude}
  if(e._new){delete e._new;delete e._poi;ents.push(e);byId.set(siren,e)}
  else{await dbDelete(old);byId.delete(old);byId.set(siren,e)}
  await saveEnt(e);
  comp={status:"linked",cands:[],q:""};
  if(cur===e)renderFiche();
  toast("Société insérée : SIREN "+siren+" · TVA "+e.tva,4500);
}

function bindFiche(){
  const e=cur,S=id=>$(id);
  const persist=()=>{if(!e._new)saveEnt(e).then(()=>{const s=S("#saved");if(s)s.textContent="Enregistré"})};
  S("#close").onclick=closeFiche;
  const bindText=(id,key)=>{const el=S(id);if(el)el.oninput=()=>{e[key]=el.value;persist()}};
  ["nom","raison","tel","contact","fonction","mobile","notes"].forEach(k=>bindText("#f_"+k,k));
  S("#f_tel").addEventListener("input",()=>{S("#call").href="tel:"+S("#f_tel").value.replace(/\s/g,"")});
  S("#f_adresse").onchange=ev=>{e.adresse=ev.target.value;e.cp="";e.commune="";persist()};
  S("#gps").onclick=async()=>{try{toast("Recherche de la position…");e.posTerrain=await getPos();if(!e.lat){e.lat=e.posTerrain.lat;e.lng=e.posTerrain.lng}persist();renderFiche()}catch(er){toast(er.message)}};
  const g2=S("#gps2");if(g2)g2.onclick=()=>{e.lat=e.posTerrain.lat;e.lng=e.posTerrain.lng;persist();renderFiche();toast("Point du commerce mis à jour")};
  S("#d_oui").onclick=()=>{e.refus=null;e._oui=true;persist();renderFiche()};
  S("#d_non").onclick=()=>{
    if((e.devis||[]).length){toast("Supprimez d'abord les devis de cette fiche.");return}
    e._oui=false;if(!e.refus)e.refus={relance:"",motif:""};persist();renderFiche()};
  document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{
    e.devis.push({id:uid(),produit:b.dataset.add,montant:"",relance:"",statut:"en cours",date:today()});persist();renderFiche()});
  document.querySelectorAll("#devislist .devis").forEach(box=>{
    const i=+box.dataset.i;
    box.querySelectorAll("[data-k]").forEach(inp=>{
      const upd=()=>{e.devis[i][inp.dataset.k]=inp.value;persist()};
      inp.oninput=upd;
      if(inp.tagName==="SELECT"||inp.dataset.k==="relance")inp.onchange=()=>{upd();renderFiche()};
    });

async function pappersFill(e){
  const token=ls.get("pappers_token");
  if(!token){toast("Ajoutez d'abord votre clé Pappers dans l'onglet Données.");return}
  try{
    toast("Interrogation de Pappers…");
    const r=await fetch("https://api.pappers.fr/v2/entreprise?api_token="+encodeURIComponent(token)+"&siren="+encodeURIComponent(e.siren));
    if(!r.ok)throw new Error("Pappers a répondu "+r.status);
    const j=await r.json();
    if(j.numero_tva_intracommunautaire)e.tva=j.numero_tva_intracommunautaire;
    const s=j.siege||{};
    if(s.latitude&&s.longitude&&!e.lat){e.lat=+s.latitude;e.lng=+s.longitude}
    if(j.telephone&&!e.tel)e.tel=j.telephone;
    await saveEnt(e);renderFiche();toast("Fiche complétée");
  }catch(er){toast("Pappers : "+er.message,4500)}
}

async function download(blob,name){
  try{const file=new File([blob],name,{type:blob.type||"application/octet-stream"});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}}
  catch(er){if(er&&er.name==="AbortError")return}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)
}
function codeSecteurMetier(naf){
  const raw=String(naf||"").toUpperCase().replace(/\s/g,"");
  if(/^03\.?11/.test(raw))return"EZ";
  if(/^68\.?20A/.test(raw))return"EZ";
  if(/^49\.?10/.test(raw))return"G";
  if(/^49\.?20/.test(raw))return"Y";
  const n=raw.replace(/[^0-9]/g,"");
  if(n.length<2)return"";
  const has=(...p)=>p.some(x=>n.startsWith(x));
  if(has("8030"))return"34";
  if(has("4771","4772"))return"CZ";
  if(has("7711","7712"))return"G";
  if(has("7721"))return"V";
  if(has("7734","5010","5030"))return"EZ";
  if(has("8230"))return"W";
  if(has("8511","8551"))return"V";
  if(has("8552"))return"M";
  if(has("8553"))return"G";
  if(has("7111"))return"E";
  if(has("7112","7120"))return"BZ";
  if(has("6910"))return"O";
  if(has("6920"))return"N";
  if(has("7021"))return"L";
  if(has("7022"))return"X";
  if(has("7410","7420","7430"))return"M";
  if(has("7490"))return"34";
  if(has("5829"))return"K";
  if(has("5811","5813","5814","5819","591","592","60"))return"M";
  if(has("4221","4222","4322"))return"33";

async function rechercherNafPilotage(e){
  if(e.naf)return e.naf;
  const s=String(e.siren||""),t=String(e.siret||"");
  const siren=/^\d{9}$/.test(s)?s:(/^\d{14}$/.test(t)?t.slice(0,9):"");
  if(!siren)return"";
  try{
    const r=await fetch("https://recherche-entreprises.api.gouv.fr/search?q="+encodeURIComponent(siren)+"&per_page=5");
    if(!r.ok)return"";
    const j=await r.json(),x=(j.results||[]).find(v=>String(v.siren||"")===siren);
    if(!x)return"";
    const g=x.siege||{},naf=g.activite_principale||x.activite_principale||"";
    if(naf){e.naf=naf;e.section=x.section_activite_principale||sectionOf(naf);await saveEnt(e)}
  }catch(er){}
  return e.naf||"";
}
function synchroniserPilotage(rows,url,target){
  const frame=document.createElement("iframe");
  frame.name=target;frame.title="Synchronisation du pilotage";frame.style.display="none";
  document.body.appendChild(frame);
  const form=document.createElement("form");
  form.method="POST";form.action=url;form.target=target;form.style.display="none";
  const input=document.createElement("input");input.type="hidden";input.name="payload";input.value=JSON.stringify({rows});
  form.appendChild(input);document.body.appendChild(form);form.submit();form.remove();
  setTimeout(()=>frame.remove(),30000);
  return true;
}
async function exportPilotage(){
  const syncUrl=ls.get("pilotage_sync_url");
  const syncTarget=syncUrl?"pilotage_sync_"+Date.now():"";
  const prospects=ents.filter(e=>!/^\d{9}$/.test(e.siren)||e.contact||e.mobile||e.fonction||e.notes||(e.devis||[]).length||e.refus||e.posTerrain);
  toast("Vérification des codes NAF…",5000);
  const sansNaf=prospects.filter(e=>!e.naf);
  for(let i=0;i<sansNaf.length;i+=3)await Promise.all(sansNaf.slice(i,i+3).map(rechercherNafPilotage));
  const rows=prospects.map(e=>({
    "Entreprise":e.nom,"Adresse":[e.adresse,e.cp,e.commune].filter(Boolean).join(", "),"Téléphone commerce":e.tel,
    "Portable contact":e.mobile,"Coordonnées GPS":e.lat&&e.lng?e.lat+", "+e.lng:"",
    "Devis souhaité":(e.devis||[]).length?"☑":"","Décideur":e.contact,"Fonction":e.fonction,
    "Secteur":codeSecteurMetier(e.naf)
  }));
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows,{header:["Entreprise","Adresse","Téléphone commerce","Portable contact","Coordonnées GPS","Devis souhaité","Décideur","Fonction","Secteur"]}),"02_CRM_Prospects");
  const out=XLSX.write(wb,{bookType:"xlsx",type:"array"});
  const syncSent=syncUrl?synchroniserPilotage(rows,syncUrl,syncTarget):false;
  download(new Blob([out],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}),"prospection-pour-pilotage-"+today()+".xlsx");
  const sansSecteur=rows.filter(r=>!r.Secteur).length;
  let msg=rows.length+" entreprises exportées; "+sansSecteur+" sans secteur NAF reconnu.";
  if(syncSent)msg+=" Synchronisation envoyée au pilotage; vérifie l’onglet 02_CRM_Prospects.";
  else if(syncUrl)msg+=" Envoi bloqué par le navigateur; réessaie après avoir autorisé les téléchargements.";
  else msg+=" Enregistre l’URL Apps Script pour activer l’envoi automatique.";
  toast(msg,6000)
}

async function runImport(){
  importing=true;stopImport=false;if(tab==="donnees")viewDonnees($("#main"));
  const bar=()=>$("#impbar"),txt=()=>$("#imptxt");
  const segs=[];["2A","2B"].forEach(d=>Object.keys(SECTIONS).forEach(s=>segs.push([d,s])));
  let added=0;
  try{
    for(let si=0;si<segs.length&&!stopImport;si++){
      const [d,s]=segs[si],key="imp:"+d+":"+s;
      let page=(await metaGet(key))||1;
      if(page===-1)continue;
      for(;;){
        if(stopImport)break;
        const url="https://recherche-entreprises.api.gouv.fr/search?departement="+d+"&section_activite_principale="+s+"&etat_administratif=A&per_page=25&page="+page;
        let j=null;
        for(let k=0;k<4;k++){
          const r=await fetch(url);
          if(r.status===429){await sleep(1500*(k+1));continue}
          if(r.status===400){j={results:[],total_pages:0};break}
          if(!r.ok)throw new Error("Erreur serveur "+r.status);
          j=await r.json();break;
        }
        if(!j)throw new Error("Trop de requêtes, réessayez dans une minute");
        const batch=[];
        (j.results||[]).forEach(x=>{
          const g=x.siege||{},siren=String(x.siren||"");
          if(!siren||byId.has(siren))return;
          const naf=g.activite_principale||x.activite_principale||"";
          batch.push(newEnt({siren,nom:x.nom_complet||x.nom_raison_sociale||"",adresse:g.adresse?g.adresse.replace(/\s+\d{5}\s.*$/,""):"",
            cp:g.code_postal||"",commune:g.libelle_commune||"",dept:d,naf,section:x.section_activite_principale||sectionOf(naf),
            tva:tvaFromSiren(siren),lat:g.latitude?+g.latitude:null,lng:g.longitude?+g.longitude:null}));
        });
        if(batch.length){await dbPutMany(batch);batch.forEach(e=>{ents.push(e);byId.set(e.siren,e);index(e)});added+=batch.length}
        const tp=Math.min(j.total_pages||0,400);
        if(bar()){bar().hidden=false;bar().max=segs.length;bar().value=si+(tp?Math.min(page/tp,1):1)}
        if(txt())txt().textContent="Département "+d+" · section "+s+" · page "+page+"/"+(tp||1)+" · "+added.toLocaleString("fr-FR")+" nouvelles fiches";
        $("#count").textContent=ents.length.toLocaleString("fr-FR")+" fiches";
        if(!j.results||!j.results.length||page>=tp){await metaSet(key,-1);break}
        page++;await metaSet(key,page);await sleep(160);
      }
    }
    if(txt())txt().textContent=(stopImport?"Import arrêté. ":"Import terminé. ")+added.toLocaleString("fr-FR")+" nouvelles fiches.";
  }catch(er){toast("Import interrompu : "+er.message,5000);if(txt())txt().textContent="Interrompu : "+er.message+". Relancez pour reprendre."}
  importing=false;stopImport=false;
  const b=$("#imp");if(b)b.textContent="Lancer / reprendre l'import";
}
